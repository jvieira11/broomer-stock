name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # Toda segunda às 9h (Maceió): pega vulnerabilidades novas em dependências
  # mesmo sem mudança no código. Se falhar, o GitHub avisa por e-mail.
  schedule:
    - cron: "0 12 * * 1"

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependências (vulnerabilidades)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Só o que vai para produção; falha com vulnerabilidade alta ou crítica.
      # Moderadas e baixas aparecem no log para avaliação, sem travar.
      - run: pnpm audit --prod --audit-level high

  api:
    name: API (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stock_user
          POSTGRES_PASSWORD: stock_password
          POSTGRES_DB: stock_database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_user -d stock_database"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Os testes e2e usam stock_database_test, criado e migrado sozinho.
      DATABASE_URL: postgresql://stock_user:stock_password@localhost:5432/stock_database?schema=public
      JWT_SECRET: segredo-usado-so-no-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter api exec eslint "{src,test}/**/*.ts"
      - name: Tipos
        run: pnpm --filter api exec tsc --noEmit
      - name: Testes unitários
        run: pnpm --filter api test
      - name: Testes e2e
        run: pnpm --filter api test:e2e
      - name: Build
        run: |
          pnpm --filter api build
          # O container roda dist/main.js; garante que o build não mudou de lugar.
          test -f apps/api/dist/main.js

  web:
    name: Web (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter web lint
      - name: Tipos
        run: |
          pnpm --filter web exec next typegen
          pnpm --filter web exec tsc --noEmit
      - name: Testes
        run: pnpm --filter web test
      - name: Build
        run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build da API
        run: docker build -f apps/api/Dockerfile -t stock-api:ci .
      - name: Build do web
        run: docker build -f apps/web/Dockerfile -t stock-web:ci .
